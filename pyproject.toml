[project]
name = "melanoma-classifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "gradio>=6.22.0",
    "kaggle>=1.6.17",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.32",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# "import torch.nn as nn" is what PyTorch's own docs and every tutorial use.
# Ruff would rather have "from torch import nn"; the convention wins.
ignore = ["PLR0402"]
