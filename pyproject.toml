[project]
name = "melanoma-classifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "gradio>=6.22.0",
    "kaggle>=1.6.17",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.32",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

# On Linux, torch defaults to the CUDA build: a dozen nvidia-* packages and
# some 2.5 GB, for a graphics card neither the CI runner nor the container has.
# Pointing Linux at the cpu index avoids the download; macOS is left alone,
# where the normal wheel already targets Apple's own chip.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# PLR0402: "import torch.nn as nn" is what PyTorch's own docs and every
#   tutorial use. Ruff would rather have "from torch import nn"; the
#   convention wins.
# B008: Gradio passes the progress reporter as a default argument, as in
#   "def f(x, progress=gr.Progress())". That is the documented way to ask for
#   one, and there is no other.
ignore = ["PLR0402", "B008"]
